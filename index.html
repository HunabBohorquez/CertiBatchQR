<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CertiBatchQR — Generador Masivo de Constancias con QR</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>CertiBatchQR</h1>
    <p>Generador masivo de constancias y gafetes con código QR</p>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>1. Plantilla</h2>
      <label>Institución / Organización<input id="tplInstitucion" type="text"></label>
      <label>Título de la constancia<input id="tplTitulo" type="text"></label>
      <label>Nombre del evento<input id="tplEvento" type="text"></label>
      <label>Texto del cuerpo
        <textarea id="tplCuerpo" rows="4"></textarea>
        <small>Marcadores: {{NOMBRE}} {{ROL}} {{EVENTO}} {{FECHA}} {{FOLIO}}</small>
      </label>
      <label>Fecha del evento<input id="tplFecha" type="text"></label>
      <div class="row">
        <label>Firmante<input id="tplFirmante" type="text"></label>
        <label>Cargo<input id="tplCargo" type="text"></label>
      </div>
      <div class="row">
        <label>Color de acento<input id="tplColor" type="color" value="#1f4e79"></label>
        <label>Logotipo<input id="tplLogo" type="file" accept="image/*"></label>
      </div>

      <h2>2. Participantes</h2>
      <textarea id="csvText" rows="4" placeholder="nombre,rol,correo"></textarea>
      <div class="row buttons">
        <button id="btnImportar">Importar CSV pegado</button>
        <label class="btn">Subir .csv<input id="csvFile" type="file" accept=".csv,text/csv" hidden></label>
        <button id="btnDemo" class="secondary">Cargar Taller Demo</button>
        <button id="btnAgregar" class="secondary">+ Fila</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Nombre</th><th>Rol</th><th>Correo</th><th></th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel preview">
      <h2>3. Vista previa</h2>
      <canvas id="canvas" width="1122" height="794"></canvas>
      <div class="row nav">
        <button id="btnPrev">&lt; Anterior</button>
        <span id="navInfo">0 / 0</span>
        <button id="btnNext">Siguiente &gt;</button>
      </div>
      <h2>4. Exportar</h2>
      <div class="row buttons">
        <button id="btnPdf">Generar PDF Masivo</button>
        <button id="btnBitacora" class="secondary">Descargar Bitácora de Folios (CSV)</button>
      </div>
      <div class="progress"><div id="bar"></div></div>
      <p id="status" class="status"></p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
